substitutions:
  _REGION: asia-northeast1
  _SERVICE: frichy
  _REPOSITORY: frichy
  _IMAGE: web
  _GCS_BUCKET_NAME: frichy-322534405950-resumes
  _NUXT_PUBLIC_API_BASE: /api
  _NUXT_PUBLIC_SHOW_DEMO_LOGIN: "false"
  _DATABASE_URL_SECRET: frichy-prod-database-url
  _JWT_SECRET_SECRET: frichy-prod-jwt-secret
  _DATA_ENCRYPTION_KEY_SECRET: frichy-prod-data-encryption-key
  _CORS_ORIGIN_SECRET: frichy-prod-cors-origin

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:$SHORT_SHA
      - --build-arg
      - NUXT_PUBLIC_API_BASE=${_NUXT_PUBLIC_API_BASE}
      - --build-arg
      - NUXT_PUBLIC_SHOW_DEMO_LOGIN=${_NUXT_PUBLIC_SHOW_DEMO_LOGIN}
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:$SHORT_SHA

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:$SHORT_SHA
      - --region
      - ${_REGION}
      - --platform
      - managed
      - --allow-unauthenticated
      - --port
      - "8080"
      - --set-env-vars
      - NODE_ENV=production,NUXT_PUBLIC_API_BASE=${_NUXT_PUBLIC_API_BASE},NUXT_PUBLIC_SHOW_DEMO_LOGIN=${_NUXT_PUBLIC_SHOW_DEMO_LOGIN},GCS_BUCKET_NAME=${_GCS_BUCKET_NAME}
      - --set-secrets
      - DATABASE_URL=${_DATABASE_URL_SECRET}:latest,JWT_SECRET=${_JWT_SECRET_SECRET}:latest,DATA_ENCRYPTION_KEY=${_DATA_ENCRYPTION_KEY_SECRET}:latest,CORS_ORIGIN=${_CORS_ORIGIN_SECRET}:latest

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:$SHORT_SHA
