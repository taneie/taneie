substitutions:
  _REGION: asia-northeast1
  _SERVICE: frichy
  _REPOSITORY: frichy
  _IMAGE: web
  _GCS_BUCKET_NAME: frichy-322534405950-resumes
  _NUXT_PUBLIC_API_BASE: /api
  _NUXT_PUBLIC_SHOW_DEMO_LOGIN: "false"
  _SMTP_HOST: ""
  _SMTP_PORT: "587"
  _SMTP_SECURE: "false"
  _SMTP_USER: ""
  _EMAIL_FROM: ""
  _EMAIL_REPLY_TO: ""
  _DATABASE_URL_SECRET: frichy-prod-database-url
  _JWT_SECRET_SECRET: frichy-prod-jwt-secret
  _DATA_ENCRYPTION_KEY_SECRET: frichy-prod-data-encryption-key
  _CORS_ORIGIN_SECRET: frichy-prod-cors-origin
  _SMTP_PASSWORD_SECRET: ""
  _JOB_CLEANUP_SECRET_SECRET: frichy-prod-job-cleanup-secret

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:$SHORT_SHA
      - --build-arg
      - NUXT_PUBLIC_API_BASE=${_NUXT_PUBLIC_API_BASE}
      - --build-arg
      - NUXT_PUBLIC_SHOW_DEMO_LOGIN=${_NUXT_PUBLIC_SHOW_DEMO_LOGIN}
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:$SHORT_SHA

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        ENV_VARS=(
          "NODE_ENV=production"
          "NUXT_PUBLIC_API_BASE=${_NUXT_PUBLIC_API_BASE}"
          "NUXT_PUBLIC_SHOW_DEMO_LOGIN=${_NUXT_PUBLIC_SHOW_DEMO_LOGIN}"
          "GCS_BUCKET_NAME=${_GCS_BUCKET_NAME}"
        )
        if [ -n "${_SMTP_HOST}" ]; then
          ENV_VARS+=("SMTP_HOST=${_SMTP_HOST}")
          ENV_VARS+=("SMTP_PORT=${_SMTP_PORT}")
          ENV_VARS+=("SMTP_SECURE=${_SMTP_SECURE}")
        fi
        if [ -n "${_SMTP_USER}" ]; then
          ENV_VARS+=("SMTP_USER=${_SMTP_USER}")
        fi
        if [ -n "${_EMAIL_FROM}" ]; then
          ENV_VARS+=("EMAIL_FROM=${_EMAIL_FROM}")
        fi
        if [ -n "${_EMAIL_REPLY_TO}" ]; then
          ENV_VARS+=("EMAIL_REPLY_TO=${_EMAIL_REPLY_TO}")
        fi

        SECRETS=(
          "DATABASE_URL=${_DATABASE_URL_SECRET}:latest"
          "JWT_SECRET=${_JWT_SECRET_SECRET}:latest"
          "DATA_ENCRYPTION_KEY=${_DATA_ENCRYPTION_KEY_SECRET}:latest"
          "CORS_ORIGIN=${_CORS_ORIGIN_SECRET}:latest"
          "JOB_CLEANUP_SECRET=${_JOB_CLEANUP_SECRET_SECRET}:latest"
        )
        if [ -n "${_SMTP_PASSWORD_SECRET}" ]; then
          SECRETS+=("SMTP_PASSWORD=${_SMTP_PASSWORD_SECRET}:latest")
        fi

        ENV_VARS_ARG="$$(IFS=,; echo "$${ENV_VARS[*]}")"
        SECRETS_ARG="$$(IFS=,; echo "$${SECRETS[*]}")"

        gcloud run deploy "${_SERVICE}" \
          --image "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:$SHORT_SHA" \
          --region "${_REGION}" \
          --platform managed \
          --allow-unauthenticated \
          --port "8080" \
          --set-env-vars "$${ENV_VARS_ARG}" \
          --set-secrets "$${SECRETS_ARG}"

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:$SHORT_SHA
