services:
  postgres:
    image: postgres:16-alpine
    container_name: frichy-postgres
    environment:
      POSTGRES_USER: frichy
      POSTGRES_PASSWORD: frichy
      POSTGRES_DB: frichy
    ports:
      - "5432:5432"
    volumes:
      - frichy-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U frichy -d frichy"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  frichy-postgres:
