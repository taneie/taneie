services:
  postgres:
    image: postgres:16-alpine
    container_name: tryangle-freelance-postgres
    environment:
      POSTGRES_USER: tryangle
      POSTGRES_PASSWORD: tryangle
      POSTGRES_DB: tryangle_freelance
    ports:
      - "5432:5432"
    volumes:
      - tryangle-freelance-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tryangle -d tryangle_freelance"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tryangle-freelance-postgres:
