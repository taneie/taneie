services:
  postgres:
    image: postgres:16-alpine
    container_name: freelink-postgres
    environment:
      POSTGRES_USER: freelink
      POSTGRES_PASSWORD: freelink
      POSTGRES_DB: freelink
    ports:
      - "5432:5432"
    volumes:
      - freelink-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U freelink -d freelink"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  freelink-postgres:
