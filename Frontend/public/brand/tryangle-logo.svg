<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 160" role="img" aria-labelledby="title desc">
  <title id="title">TRYANGLE FREELANCE logo</title>
  <desc id="desc">TRYANGLE FREELANCE wordmark with a triangular connected-node symbol.</desc>
  <defs>
    <linearGradient id="leftLine" x1="52" y1="118" x2="82" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b3f95"/>
