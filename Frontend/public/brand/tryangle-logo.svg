  <text x="318" y="78" fill="#0f8ca8" font-family="Inter, Arial, sans-serif" font-size="54" font-weight="800" letter-spacing="8">A</text>
  <text x="366" y="78" fill="#0b3f95" font-family="Inter, Arial, sans-serif" font-size="54" font-weight="800" letter-spacing="8">NGLE</text>
