    </linearGradient>
    <linearGradient id="rightLine" x1="86" y1="38" x2="126" y2="118" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1d5fd3"/>
      <stop offset="1" stop-color="#0f8ca8"/>
    </linearGradient>
    <linearGradient id="bottomLine" x1="42" y1="118" x2="126" y2="118" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b3f95"/>
      <stop offset="1" stop-color="#0f8ca8"/>
