<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">TRYANGLE FREELANCE mark</title>
  <desc id="desc">Three connected nodes forming a triangle, representing freelancer matching.</desc>
  <defs>
    <linearGradient id="leftLine" x1="42" y1="100" x2="64" y2="22" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b3f95"/>
      <stop offset="1" stop-color="#1d5fd3"/>
    </linearGradient>
    <linearGradient id="rightLine" x1="64" y1="22" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1d5fd3"/>
      <stop offset="1" stop-color="#0f8ca8"/>
    </linearGradient>
    <linearGradient id="bottomLine" x1="28" y1="100" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b3f95"/>
      <stop offset="1" stop-color="#0f8ca8"/>
    </linearGradient>
  </defs>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
