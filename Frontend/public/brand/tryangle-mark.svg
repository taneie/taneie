    <path d="M67 30 L95 96" stroke="url(#rightLine)" stroke-width="12"/>
    <path d="M32 96 H96" stroke="url(#bottomLine)" stroke-width="12"/>
  </g>
  <circle cx="64" cy="26" r="15" fill="#1d5fd3"/>
  <circle cx="64" cy="26" r="6" fill="white"/>
  <circle cx="28" cy="98" r="16" fill="#0b3f95"/>
  <circle cx="28" cy="98" r="6.5" fill="white"/>
  <circle cx="100" cy="98" r="16" fill="#0f8ca8"/>
  <circle cx="100" cy="98" r="6.5" fill="white"/>
