name: Deploy Cloud Run

on:
  workflow_dispatch:
    inputs:
      auth_method:
        description: "Google Cloud auth method"
        required: false
        default: "workload_identity"
        type: choice
        options:
          - "workload_identity"
          - "credentials_json"

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || 'frichy' }}
  GCP_REGION: ${{ vars.GCP_REGION || 'asia-northeast1' }}
  GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER || 'projects/322534405950/locations/global/workloadIdentityPools/github/providers/github' }}
  GCP_DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT || 'frichy-github-deployer@frichy.iam.gserviceaccount.com' }}
  GAR_REPOSITORY: ${{ vars.GAR_REPOSITORY || 'frichy' }}
  IMAGE_NAME: ${{ vars.IMAGE_NAME || 'web' }}
  CLOUD_RUN_SERVICE: ${{ vars.CLOUD_RUN_SERVICE || 'frichy' }}
  CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT: ${{ vars.CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT || 'frichy-cloud-run-runtime@frichy.iam.gserviceaccount.com' }}
  GCS_BUCKET_NAME: ${{ vars.GCS_BUCKET_NAME || 'frichy-322534405950-resumes' }}
  NUXT_PUBLIC_API_BASE: ${{ vars.NUXT_PUBLIC_API_BASE || '/api' }}
  NUXT_PUBLIC_SHOW_DEMO_LOGIN: ${{ vars.NUXT_PUBLIC_SHOW_DEMO_LOGIN || 'false' }}
  SECRET_DATABASE_URL: ${{ vars.SECRET_DATABASE_URL || 'frichy-prod-database-url' }}
  SECRET_JWT_SECRET: ${{ vars.SECRET_JWT_SECRET || 'frichy-prod-jwt-secret' }}
  SECRET_DATA_ENCRYPTION_KEY: ${{ vars.SECRET_DATA_ENCRYPTION_KEY || 'frichy-prod-data-encryption-key' }}
  SECRET_CORS_ORIGIN: ${{ vars.SECRET_CORS_ORIGIN || 'frichy-prod-cors-origin' }}

jobs:
  deploy:
    environment: production
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Google Cloud auth method
        id: gcp-auth
        env:
          AUTH_METHOD: ${{ inputs.auth_method || 'workload_identity' }}
          WIF_PROVIDER: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          WIF_SERVICE_ACCOUNT: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}
          CREDENTIALS_JSON: ${{ secrets.GCP_CREDENTIALS_JSON }}
        run: |
          if [ "${AUTH_METHOD}" = "credentials_json" ]; then
            if [ -n "${CREDENTIALS_JSON}" ]; then
              echo "method=json" >> "${GITHUB_OUTPUT}"
              echo "Using credentials JSON."
              exit 0
            fi

            echo "::error::auth_method is credentials_json, but GitHub Secret GCP_CREDENTIALS_JSON is not set."
            exit 1
          fi

          if [ -n "${WIF_PROVIDER}" ] && [ -n "${WIF_SERVICE_ACCOUNT}" ]; then
            echo "method=wif" >> "${GITHUB_OUTPUT}"
            echo "Using Workload Identity."
            exit 0
          fi

          if [ -n "${CREDENTIALS_JSON}" ]; then
            echo "method=json" >> "${GITHUB_OUTPUT}"
            echo "Using credentials JSON."
            exit 0
          fi

          if [ -n "${WIF_PROVIDER}" ] && [ -z "${WIF_SERVICE_ACCOUNT}" ]; then
            echo "::warning::GCP_WORKLOAD_IDENTITY_PROVIDER is set, but GCP_DEPLOY_SERVICE_ACCOUNT is missing."
          fi

          echo "::error::Workload Identity configuration is missing. Set GitHub Variables GCP_WORKLOAD_IDENTITY_PROVIDER and GCP_DEPLOY_SERVICE_ACCOUNT, or rerun with auth_method=credentials_json after setting GitHub Secret GCP_CREDENTIALS_JSON."
          exit 1

      - name: Authenticate to Google Cloud with Workload Identity
        if: ${{ steps.gcp-auth.outputs.method == 'wif' }}
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Authenticate to Google Cloud with credentials JSON
        if: ${{ steps.gcp-auth.outputs.method == 'json' }}
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          credentials_json: ${{ secrets.GCP_CREDENTIALS_JSON }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Build container image
        run: |
          IMAGE_URI="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME}:${GITHUB_SHA}"
          docker build \
            --build-arg NUXT_PUBLIC_API_BASE="${NUXT_PUBLIC_API_BASE}" \
            --build-arg NUXT_PUBLIC_SHOW_DEMO_LOGIN="${NUXT_PUBLIC_SHOW_DEMO_LOGIN}" \
            --tag "${IMAGE_URI}" \
            .
          echo "IMAGE_URI=${IMAGE_URI}" >> "${GITHUB_ENV}"

      - name: Push container image
        run: docker push "${IMAGE_URI}"

      - name: Deploy to Cloud Run
        run: |
          SERVICE_ACCOUNT_ARGS=()
          if [ -n "${CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT}" ]; then
            SERVICE_ACCOUNT_ARGS=(--service-account "${CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT}")
          fi

          gcloud run deploy "${CLOUD_RUN_SERVICE}" \
            --project "${GCP_PROJECT_ID}" \
            --region "${GCP_REGION}" \
            --platform managed \
            --image "${IMAGE_URI}" \
            "${SERVICE_ACCOUNT_ARGS[@]}" \
            --port 8080 \
            --set-env-vars "NODE_ENV=production,NUXT_PUBLIC_API_BASE=${NUXT_PUBLIC_API_BASE},NUXT_PUBLIC_SHOW_DEMO_LOGIN=${NUXT_PUBLIC_SHOW_DEMO_LOGIN},GCS_BUCKET_NAME=${GCS_BUCKET_NAME}" \
            --set-secrets "DATABASE_URL=${SECRET_DATABASE_URL}:latest,JWT_SECRET=${SECRET_JWT_SECRET}:latest,DATA_ENCRYPTION_KEY=${SECRET_DATA_ENCRYPTION_KEY}:latest,CORS_ORIGIN=${SECRET_CORS_ORIGIN}:latest"
